backend:
  name: github
  repo: ваш-логин/specpotok-site
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "people"
    label: "Преподаватели"
    files:
      - name: "people"
        label: "Список преподавателей"
        file: "data/people.json"
        fields:
          - name: "people"
            label: "Преподаватели"
            widget: "list"
            fields:
              - { label: "ФИО", name: "name", widget: "string" }
              - { label: "Роль", name: "role", widget: "string" }
              - { label: "Степень", name: "degree", widget: "string" }
              - { label: "Кафедра", name: "chair", widget: "string" }
              - { label: "О преподавателе", name: "bio", widget: "text" }
              - { label: "Email", name: "email", widget: "string" }