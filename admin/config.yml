backend:
  name: github
  repo: pultyaps/specgroupa
  branch: main
  auth_type: pkce
  app_id: Ov23lijgnGwJG5F85WlY

media_folder: "images"
public_folder: "/images"

collections:
  - name: "people"
    label: "Преподаватели"
    files:
      - name: "people"
        label: "Список преподавателей"
        file: "data/people.json"
        fields:
          - name: "people"
            label: "Преподаватели"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "ФИО", name: "name", widget: "string" }
              - { label: "Роль", name: "role", widget: "string" }
              - { label: "Степень", name: "degree", widget: "string" }
              - { label: "Кафедра", name: "chair", widget: "string" }
              - label: "Курсы"
                name: "courses"
                widget: "list"
                field: { label: "Курс", name: "course", widget: "string" }
              - label: "Научные интересы"
                name: "interests"
                widget: "list"
                field: { label: "Интерес", name: "interest", widget: "string" }
              - { label: "О преподавателе", name: "bio", widget: "text" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Кабинет", name: "office", widget: "string" }
              - { label: "Часы консультаций", name: "hours", widget: "string" }

  - name: "faq"
    label: "Частые вопросы"
    files:
      - name: "faq"
        label: "FAQ"
        file: "data/faq.json"
        fields:
          - name: "faq"
            label: "Вопросы и ответы"
            widget: "list"
            summary: "{{fields.question}}"
            fields:
              - { label: "Вопрос", name: "question", widget: "string" }
              - { label: "Ответ", name: "answer", widget: "text" }

  - name: "program"
    label: "Программа курсов"
    files:
      - name: "program"
        label: "Программа"
        file: "data/program.json"
        fields:
          - name: "program"
            label: "Курсы"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Название курса", name: "title", widget: "string" }
              - { label: "Подпись", name: "sub", widget: "string" }
              - name: "semesters"
                label: "Семестры"
                widget: "list"
                summary: "{{fields.n}}"
                fields:
                  - { label: "Название семестра", name: "n", widget: "string" }
                  - { label: "Нагрузка", name: "total", widget: "string" }
                  - name: "courses"
                    label: "Дисциплины"
                    widget: "list"
                    summary: "{{fields.name}}"
                    fields:
                      - { label: "Название", name: "name", widget: "string" }
                      - { label: "Преподаватель", name: "t", widget: "string" }
                      - { label: "Часы", name: "h", widget: "string" }
                      - { label: "Экзамен", name: "ex", widget: "boolean" }
                      - { label: "Описание", name: "d", widget: "text" }
                      - { label: "Литература", name: "lit", widget: "text" }