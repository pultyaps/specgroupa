media:
  input: images
  output: /images

content:
  - name: faculty
    label: Преподаватели
    type: file
    path: data/faculty.json
    format: json
    list: true

    fields:
      - name: initials
        label: Инициалы
        type: string
        required: true

      - name: name
        label: ФИО
        type: string
        required: true

      - name: title
        label: Должность и учёная степень
        type: string

      - name: tags
        label: Научные направления
        type: string
        list: true

      - name: accent
        label: Цвет карточки
        type: string
