media:
  input: images
  output: /images

content:
  - name: people
    label: Преподаватели
    type: file
    path: data/people.json
    format: json
    list: true

    fields:
      - name: name
        label: ФИО
        type: string
        required: true

      - name: title
        label: Должность и учёная степень
        type: string

      - name: chair
        label: Кафедра
        type: string

      - name: tags
        label: Научные направления
        type: string
        list: true